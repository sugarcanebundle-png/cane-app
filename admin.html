<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>จดมัดอ้อย - หลังบ้าน</title>
<style>
:root{--bg:#f2eee0;--ink:#1c2a1d;--cane:#2f5d3a;--soft:#e6e0c8;--debt:#b3402a;--card:#fffefa;--mut:#6b705f;--gold:#d9a93a;--sh:0 1px 2px rgba(28,42,29,.06),0 8px 20px rgba(28,42,29,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#141913;--ink:#ece8d6;--cane:#6fae7e;--soft:#2a3226;--debt:#ff8a73;--card:#1d241a;--mut:#a3a891;--gold:#e0b341;--sh:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.mut{color:var(--mut);font-size:.85rem}.pos{color:var(--cane)}.neg{color:var(--debt)}
button{font:inherit;font-weight:600;padding:12px 16px;border-radius:12px;border:0;background:var(--cane);color:#fff;cursor:pointer;transition:transform .08s,opacity .15s}
button:active{transform:scale(.97);opacity:.9}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--sh)}
.card>b{display:block;margin-bottom:4px;font-size:1.02rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--soft)}
.row:last-child{border:0}.row>span:first-child{min-width:0}
body{margin:auto;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans Thai","Sarabun",system-ui,sans-serif;max-width:640px;padding-bottom:96px}
.top{background:linear-gradient(135deg,#2f5d3a,#43805a);color:#fff;padding:20px 18px 26px;border-radius:0 0 24px 24px;margin-bottom:6px}
.top b{display:block;font-size:1.3rem;letter-spacing:-.01em}.top span{opacity:.85;font-size:.85rem}
section{display:none;padding:0 14px}section.on{display:block}
.card{margin:12px 0}
label{display:block;margin:12px 0 4px;font-size:.82rem;font-weight:600;color:var(--mut)}
input,select{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--soft);background:var(--bg);color:var(--ink);outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--cane)}
button.sm{padding:7px 12px;font-size:.82rem;border-radius:10px}
button.alt{background:var(--soft);color:var(--ink)}
button.gold{background:var(--gold);color:#1c2a1d}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 12px}
.quick button{background:var(--soft);color:var(--ink);font-size:1.1rem;padding:14px 0}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:640px;display:flex;background:var(--card);box-shadow:0 -6px 20px rgba(28,42,29,.12);border-radius:20px 20px 0 0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:.72rem;border-radius:14px}
nav button i{font-style:normal;font-size:1.35rem;line-height:1}
nav button.on{color:var(--cane);background:rgba(95,150,110,.16);background:color-mix(in srgb,var(--cane) 14%,transparent)}
#dlg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;align-items:flex-end;justify-content:center}
#dlg>div{background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:20px 18px 28px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
#toast{position:fixed;left:14px;right:14px;bottom:100px;background:var(--ink);color:var(--bg);padding:13px;border-radius:14px;display:none;text-align:center;z-index:9;box-shadow:var(--sh)}
</style>
</head>
<body>
<header class="top"><b>จดมัดอ้อย</b><span>หลังบ้านแอดมิน</span></header>
<nav id="nav"></nav>

<section id="t-tally">
 <div class="card">
  <label>คนงาน</label><select id="wk1"></select>
  <button class="alt" style="width:100%;margin-top:6px" onclick="scan('wk1')">สแกน QR คนงาน</button>
  <label>แปลง</label><select id="plot1"></select>
  <label>วันที่</label><input type="date" id="date1">
  <label>จำนวนมัด</label><input type="number" id="qty1" inputmode="numeric" min="1" placeholder="0">
  <div class="quick"><button data-q="1">+1</button><button data-q="5">+5</button><button data-q="10">+10</button><button data-q="50">+50</button></div>
  <button id="save1" style="width:100%">บันทึกมัด</button>
 </div>
 <div class="card"><b>รายการล่าสุด</b><div id="recent"></div></div>
</section>

<section id="t-cash">
 <div class="card">
  <label>คนงาน</label><select id="wk2"></select>
  <button class="alt" style="width:100%;margin-top:6px" onclick="scan('wk2')">สแกน QR คนงาน</button>
  <div id="bal2" class="mut" style="margin-top:6px"></div>
  <label>จำนวนเงิน (บาท) ไม่จำกัดเพดาน</label><input type="number" id="amt2" inputmode="decimal" min="1">
  <label>หมายเหตุ</label><input id="note2" placeholder="เช่น เบิกล่วงหน้า / ค่าอาหาร">
  <button id="save2" style="width:100%;margin-top:12px">บันทึกเบิกเงิน</button>
 </div>
 <div class="card"><b>คนที่ติดลบ (เบิกเกินค่ามัด)</b><div id="debts"></div></div>
</section>

<section id="t-workers">
 <div class="card"><b>เพิ่มคนงาน</b>
  <label>ชื่อ</label><input id="wname"><label>เบอร์โทร</label><input id="wphone" inputmode="tel">
  <button id="addw" style="width:100%;margin-top:12px">เพิ่มคนงาน</button></div>
 <div class="card" id="wlist"></div>
</section>

<section id="t-plots">
 <div class="card"><b id="ptitle">เพิ่มแปลง</b>
  <input type="hidden" id="pid">
  <label>ชื่อแปลง</label><input id="pname"><label>ชนิดอ้อย</label><input id="ptype" placeholder="อ้อยสด / อ้อยไฟไหม้">
  <label>เรท บาทต่อมัด</label><input type="number" id="prate" inputmode="decimal" step="0.01">
  <button id="savep" style="width:100%;margin-top:12px">บันทึกแปลง</button></div>
 <div class="card" id="plist"></div>
</section>

<section id="t-settings">
 <div class="card" style="border-color:#b3402a">
  <b class="neg">รีเซ็ตข้อมูล (ลบแล้วกู้คืนไม่ได้)</b>
  <p class="mut">ใช้ตอนทดสอบระบบ ก่อนเริ่มใช้งานจริง ควรล็อกปุ่มนี้ด้วย SQL (ดูท้ายไฟล์ 02_reset.sql)</p>
  <button class="alt" style="width:100%;margin-top:6px" onclick="resetData('transactions')">ลบมัดและประวัติเงินทั้งหมด (เก็บคนงานกับแปลง)</button>
  <button style="width:100%;margin-top:8px;background:#b3402a" onclick="resetData('all')">ลบทุกอย่าง (รวมคนงานและแปลง)</button>
 </div>
</section>

<div id="dlg"></div>
<div id="toast"></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const CONFIG={LIFF_ID:'2012750101-5UuLvmYG',SUPABASE_URL:'https://kvptrqeuwpixryrbibtu.supabase.co',SUPABASE_ANON_KEY:'sb_publishable_IlCLtd4xQv9WgZgWQm1XEg_jnOuBSLI',AUTH_FUNCTION:'quick-function'};
if(!CONFIG.SUPABASE_URL||!CONFIG.SUPABASE_ANON_KEY||!CONFIG.LIFF_ID){document.body.insertAdjacentHTML('afterbegin','<div class="card" style="color:#b3402a"><b>ยังไม่ได้กรอก CONFIG</b><br>แก้ต้นสคริปต์ของไฟล์นี้: LIFF_ID, SUPABASE_URL, SUPABASE_ANON_KEY, AUTH_FUNCTION</div>');throw new Error('CONFIG empty')}
const sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
const todayTH=()=>new Date(Date.now()+7*3600e3).toISOString().slice(0,10);  // วันที่เวลาไทย (UTC+7)
const fmt=n=>Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ERR={forbidden:'ไม่มีสิทธิ์แอดมิน',reason_required:'ต้องใส่เหตุผล',amount_must_be_positive:'จำนวนเงินต้องมากกว่า 0',qty_must_be_positive:'จำนวนมัดต้องมากกว่า 0',nothing_to_pay:'ไม่มียอดคงเหลือให้จ่าย',already_voided:'ยกเลิกไปแล้ว'};
let W=[],P=[],tt;
function toast(m,bad){const t=$('toast');t.textContent=m;t.style.background=bad?'#b3402a':'';t.style.color=bad?'#fff':'';t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2600)}
let busy=false;
async function rpc(fn,args){
  if(busy){toast('กำลังบันทึก รอสักครู่',1);throw new Error('busy')}   // กันกดซ้ำ = กันบันทึกเงินซ้ำ
  busy=true;
  try{const {data,error}=await sb.rpc(fn,args);if(error){const k=Object.keys(ERR).find(k=>error.message.includes(k));toast(k?ERR[k]:error.message,1);throw error}return data}
  finally{busy=false}
}
// กล่องถามในหน้า (แทน prompt/confirm ที่บางเครื่อง/เบราว์เซอร์ใน LINE ใช้ไม่ได้)
function ask({title,msg,fields=[],ok='ยืนยัน',danger}){
  return new Promise(res=>{
    const d=$('dlg');
    d.innerHTML=`<div><b>${esc(title)}</b>${msg?`<p class="mut">${esc(msg)}</p>`:''}${fields.map((f,i)=>`<label>${esc(f.label)}</label><input id="dl${i}" type="${f.type||'text'}" inputmode="${f.mode||'text'}" ${f.step?`step="${f.step}"`:''} placeholder="${esc(f.ph||'')}">`).join('')}<div class="btns"><button class="alt" id="dlc">ยกเลิก</button><button id="dlo"${danger?' style="background:#b3402a"':''}>${esc(ok)}</button></div></div>`;
    d.style.display='flex';
    const close=v=>{d.style.display='none';d.innerHTML='';res(v)};
    $('dlc').onclick=()=>close(null);
    $('dlo').onclick=()=>close(fields.map((_,i)=>$('dl'+i).value));
    if(fields.length)$('dl0').focus();
  });
}

async function login(){
  await liff.init({liffId:CONFIG.LIFF_ID});
  if(!liff.isLoggedIn()){liff.login();return false}
  const t=liff.getIDToken();
  const r=await fetch(`${CONFIG.SUPABASE_URL}/functions/v1/${CONFIG.AUTH_FUNCTION}`,{method:'POST',
    headers:{'Content-Type':'application/json',apikey:CONFIG.SUPABASE_ANON_KEY},body:JSON.stringify({idToken:t,id_token:t})});
  const d=await r.json();const s=d.session||d;
  if(!s.access_token)throw new Error(d.error||'เข้าสู่ระบบไม่สำเร็จ');
  await sb.auth.setSession({access_token:s.access_token,refresh_token:s.refresh_token});
  return true;
}

Object.assign(ERR,{user_not_found:'ไม่พบรหัสผู้ใช้นี้ ตรวจว่าคัดลอกครบ',already_linked:'บัญชีนี้ผูกกับคนงานคนอื่นอยู่แล้ว',worker_not_found:'ไม่พบคนงาน',plot_not_found:'ไม่พบแปลง',reset_disabled:'ปุ่มรีเซ็ตถูกล็อกไว้แล้ว',confirm_required:'ต้องพิมพ์ RESET ให้ถูกต้อง'});
async function resetData(scope){
  const what=scope==='all'?'ข้อมูลทั้งหมด รวมคนงานและแปลง':'มัดและประวัติเงินทั้งหมด';
  const v=await ask({title:'รีเซ็ตข้อมูล',msg:`จะลบ${what} ลบแล้วกู้คืนไม่ได้ พิมพ์ RESET (ตัวพิมพ์ใหญ่) เพื่อยืนยัน`,fields:[{label:'พิมพ์ RESET'}],ok:'ลบ',danger:1});
  if(!v)return;if(v[0]!=='RESET')return toast('พิมพ์ไม่ตรง ยกเลิกการรีเซ็ต',1);
  const r=await rpc('reset_data',{p_scope:scope,p_confirm:'RESET'});
  toast(`ลบแล้ว: ประวัติเงิน ${r.ledger} มัด ${r.logs} คนงาน ${r.workers} แปลง ${r.plots}`);load();
}
const TABS=[['tally','จดมัด'],['cash','เบิกเงิน'],['workers','คนงาน'],['plots','แปลง'],['settings','ตั้งค่า']];
function tab(k){TABS.forEach(([id])=>{$('t-'+id).classList.toggle('on',id===k)});[...$('nav').children].forEach((b,i)=>b.classList.toggle('on',TABS[i][0]===k))}
const IC={tally:'📝',cash:'💸',workers:'👷',plots:'🌾',settings:'⚙️'};
$('nav').innerHTML=TABS.map(([k,n])=>`<button onclick="tab('${k}')"><i>${IC[k]}</i>${n}</button>`).join('');

async function load(){
  const [w,p]=await Promise.all([sb.from('worker_balances').select('*').eq('active',true).order('worker_code'),sb.from('plots').select('*').eq('active',true).order('name')]);
  if(w.error)throw w.error;W=w.data||[];P=p.data||[];
  const wo=W.map(x=>`<option value="${x.worker_id}">${esc(x.worker_code)} ${esc(x.name)}</option>`).join('');
  const sel=(id,h)=>{const v=$(id).value;$(id).innerHTML=h;if(v)$(id).value=v};
  sel('wk1',wo);sel('wk2',wo);
  sel('plot1',P.map(x=>`<option value="${x.id}">${esc(x.name)} · ฿${fmt(x.rate)}/มัด</option>`).join(''));
  showBal();
  $('debts').innerHTML=W.filter(x=>x.balance<0).sort((a,b)=>a.balance-b.balance).map(x=>`<div class="row"><span>${esc(x.name)}</span><b class="neg">฿${fmt(-x.balance)}</b></div>`).join('')||'<p class="mut">ไม่มีคนติดลบ</p>';
  $('wlist').innerHTML=W.map(x=>`<div class="row"><span>${esc(x.worker_code)} ${esc(x.name)}<br><span class="mut">${x.user_id?'✓ ผูก LINE แล้ว':'• ยังไม่ผูก LINE'} · ค่ามัด ฿${fmt(x.total_earned)} · เบิก ฿${fmt(x.total_withdrawn)}</span></span>
    <span class="acts"><b class="${x.balance<0?'neg':'pos'}">฿${fmt(x.balance)}</b>
    ${x.user_id?`<button class="sm alt" onclick="unlinkW('${x.worker_id}')">เลิกผูก</button>`:`<button class="sm gold" onclick="linkW('${x.worker_id}')">ผูก</button>`}<button class="sm alt" onclick="adjW('${x.worker_id}')">ปรับ</button><button class="sm" onclick="settleW('${x.worker_id}')">จ่าย</button></span></div>`).join('')||'<p class="mut">ยังไม่มีคนงาน</p>';
  $('plist').innerHTML=P.map(x=>`<div class="row" onclick="editP('${x.id}')"><span>${esc(x.name)}<br><span class="mut">${esc(x.cane_type||'')}</span></span><b>฿${fmt(x.rate)}/มัด</b></div>`).join('')||'<p class="mut">ยังไม่มีแปลง</p>';
  const {data:logs}=await sb.from('bundle_logs').select('*,workers(name),plots(name)').order('created_at',{ascending:false}).limit(20);
  $('recent').innerHTML=(logs||[]).map(l=>`<div class="row"><span>${esc(l.workers?.name)} · ${esc(l.plots?.name)}<br><span class="mut">${l.work_date} · ${l.qty} มัด${l.voided?' · ยกเลิก':''}</span></span>
    <span class="acts"><b style="${l.voided?'text-decoration:line-through':''}">฿${fmt(l.amount)}</b>${l.voided?'':`<button class="sm alt" onclick="voidL('${l.id}')">ยกเลิก</button>`}</span></div>`).join('')||'<p class="mut">ยังไม่มีรายการ</p>';
}
function showBal(){const w=W.find(x=>x.worker_id===$('wk2').value);$('bal2').innerHTML=w?`คงเหลือ <b class="${w.balance<0?'neg':'pos'}">฿${fmt(w.balance)}</b>${w.balance<0?' (ค้างหนี้อยู่)':''}`:''}
$('wk2').onchange=showBal;
async function scan(selId){
  try{
    if(!liff.isApiAvailable('scanCodeV2'))return toast('สแกนได้เฉพาะในแอป LINE (ต้องเปิด Scan QR ใน LIFF)',1);
    const r=await liff.scanCodeV2();const m=/^CW:(CW\d+)$/.exec((r.value||'').trim());
    if(!m)return toast('ไม่ใช่ QR คนงานของระบบ',1);
    const w=W.find(x=>x.worker_code===m[1]);if(!w)return toast('ไม่พบคนงาน '+m[1],1);
    $(selId).value=w.worker_id;showBal();toast('เลือก '+w.name);
  }catch(e){toast('สแกนไม่ได้: '+(e.message||e),1)}
}

document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{$('qty1').value=(+$('qty1').value||0)+(+b.dataset.q)});
$('save1').onclick=async()=>{
  const q=+$('qty1').value;if(!$('wk1').value||!$('plot1').value||q<=0)return toast('เลือกคนงาน แปลง และใส่จำนวนมัด',1);
  await rpc('record_bundles',{p_worker:$('wk1').value,p_plot:$('plot1').value,p_qty:q,p_date:$('date1').value||null});
  $('qty1').value='';toast('บันทึกแล้ว '+q+' มัด');load()};
$('save2').onclick=async()=>{
  const a=+$('amt2').value;if(!$('wk2').value||a<=0)return toast('เลือกคนงานและใส่จำนวนเงิน',1);
  await rpc('withdraw_cash',{p_worker:$('wk2').value,p_amount:a,p_note:$('note2').value||null});
  $('amt2').value='';$('note2').value='';toast('เบิกเงิน ฿'+fmt(a)+' แล้ว');load()};
$('addw').onclick=async()=>{await rpc('add_worker',{p_name:$('wname').value,p_phone:$('wphone').value||null});$('wname').value='';$('wphone').value='';toast('เพิ่มคนงานแล้ว');load()};
$('savep').onclick=async()=>{await rpc('upsert_plot',{p_id:$('pid').value||null,p_name:$('pname').value,p_type:$('ptype').value||null,p_rate:+$('prate').value});
  ['pid','pname','ptype','prate'].forEach(i=>$(i).value='');$('ptitle').textContent='เพิ่มแปลง';toast('บันทึกแปลงแล้ว');load()};
function editP(id){const p=P.find(x=>x.id===id);$('pid').value=id;$('pname').value=p.name;$('ptype').value=p.cane_type||'';$('prate').value=p.rate;$('ptitle').textContent='แก้ไขแปลง (เรทใหม่ใช้กับมัดที่จดต่อจากนี้)';scrollTo(0,0)}
async function voidL(id){const v=await ask({title:'ยกเลิกรายการมัด',fields:[{label:'เหตุผลที่ยกเลิก'}],ok:'ยกเลิกรายการ',danger:1});if(!v)return;if(!v[0].trim())return toast('ต้องใส่เหตุผล',1);await rpc('void_bundle',{p_log:id,p_reason:v[0].trim()});toast('ยกเลิกแล้ว');load()}
async function linkW(id){const v=await ask({title:'ผูกบัญชี LINE',msg:'วางรหัส User UID ที่คนงานส่งมา',fields:[{label:'User UID',ph:'xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx'}],ok:'ผูก'});if(!v||!v[0].trim())return;await rpc('link_worker',{p_worker:id,p_user:v[0].trim()});toast('ผูกบัญชีแล้ว');load()}
async function unlinkW(id){const w=W.find(x=>x.worker_id===id);const v=await ask({title:'เลิกผูก LINE',msg:`เลิกผูกบัญชี LINE ของ ${w.name}? (ข้อมูลเงินไม่หาย ผูกใหม่ได้)`,ok:'เลิกผูก',danger:1});if(!v)return;await rpc('link_worker',{p_worker:id,p_user:null});toast('เลิกผูกแล้ว');load()}
async function adjW(id){const v=await ask({title:'ปรับยอด',fields:[{label:'จำนวนที่ปรับ (บวกหรือลบ)',type:'number',mode:'decimal',step:'0.01'},{label:'เหตุผล'}],ok:'ปรับยอด'});if(!v)return;const a=+v[0];if(!a||!v[1].trim())return toast('ใส่จำนวนและเหตุผล',1);await rpc('adjust_balance',{p_worker:id,p_amount:a,p_note:v[1].trim()});toast('ปรับยอดแล้ว');load()}
async function settleW(id){const w=W.find(x=>x.worker_id===id);const v=await ask({title:'จ่ายปิดงวด',msg:`${w.name} ยอดคงเหลือ ฿${fmt(w.balance)}`,ok:'จ่ายแล้ว'});if(!v)return;const r=await rpc('settle_worker',{p_worker:id,p_note:null});toast('จ่าย ฿'+fmt(r)+' แล้ว');load()}

$('date1').value=todayTH();
login().then(async ok=>{if(!ok)return;const {data:isAdmin}=await sb.rpc('is_cane_admin');if(!isAdmin){document.body.innerHTML='<div class="card" style="color:#b3402a;margin:16px"><b>ไม่มีสิทธิ์แอดมิน</b><br>บัญชีนี้ไม่ได้รับสิทธิ์เข้าหน้านี้</div>';return}tab('tally');await load()}).catch(e=>toast(e.message,1));
</script>
